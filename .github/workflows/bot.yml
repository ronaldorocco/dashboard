name: Bot Consulta GMBC

on:
  schedule:
    - cron: '*/5 * * * *'   # Verifica mensagens a cada 5 minutos
  workflow_dispatch:

concurrency:
  group: bot-consulta
  cancel-in-progress: true  # Cancela job antigo ao iniciar novo

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 4      # Força encerramento antes do próximo ciclo (5min)
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install pandas openpyxl

      - name: Verificar e responder mensagens
        env:
          BOT_TOKEN:       ${{ secrets.BOT_TOKEN }}
          CHAT_ID:         ${{ secrets.CHAT_ID }}
          GOOGLE_DRIVE_ID: ${{ secrets.GOOGLE_DRIVE_ID }}
        run: python bot_consulta.py
